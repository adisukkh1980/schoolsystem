<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ระบบบริหารจัดการโรงเรียน</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <aside class="sidebar">
      <h2>School System</h2>
      <p>ระบบบริหารจัดการโรงเรียน</p>

      <nav>
        <button class="menu active">Dashboard</button>
        <button class="menu">จัดการข้อมูลนักเรียน</button>
      </nav>
    </aside>

    <main class="main">
      <section class="header">
        <div>
          <h1>ระบบจัดการข้อมูลนักเรียน</h1>
          <p>เชื่อมต่อฐานข้อมูล Firebase Firestore</p>
        </div>
      </section>

      <section class="cards">
        <div class="card">
          <h3>จำนวนนักเรียน</h3>
          <p id="totalStudents">0</p>
        </div>
      </section>

      <section class="panel">
        <h2>เพิ่ม / แก้ไขข้อมูลนักเรียน</h2>

        <form id="studentForm">
          <input type="hidden" id="docId" />

          <div class="form-grid">
            <div>
              <label>รหัสนักเรียน</label>
              <input type="text" id="studentCode" placeholder="เช่น 001" required />
            </div>

            <div>
              <label>ชื่อ - สกุล</label>
              <input type="text" id="studentName" placeholder="เช่น เด็กชายสมชาย ใจดี" required />
            </div>

            <div>
              <label>ชั้นเรียน</label>
              <input type="text" id="studentClass" placeholder="เช่น ป.4" required />
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" id="saveBtn">บันทึกข้อมูล</button>
            <button type="button" id="cancelBtn" class="secondary" style="display:none;">ยกเลิก</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>รายการข้อมูลนักเรียน</h2>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>รหัส</th>
                <th>ชื่อ - สกุล</th>
                <th>ชั้น</th>
                <th>จัดการ</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <tr>
                <td colspan="4">กำลังโหลดข้อมูล...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
